version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: bravo-inventory-postgres
    environment:
      POSTGRES_DB: bravo_inventory
      POSTGRES_USER: bravo
      POSTGRES_PASSWORD: bravo
    ports:
      - "5433:5432"
    volumes:
      - bravo_inventory_pgdata:/var/lib/postgresql/data

volumes:
  bravo_inventory_pgdata: